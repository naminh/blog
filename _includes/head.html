<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/css/override.css" | relative_url }}">
  <link rel="icon" type="image/png" href="{{ "/favicon.png" | relative_url }}">

  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- highlight.js support -->
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/github.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/ssms.css" | relative_url }}">

  <script defer src="{{ "/js/highlightjs/highlight.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/plaintext.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/powershell.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/tsql.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlight-init.js" | relative_url }}"></script>
  <!-- end highlight.js support -->
</head>
