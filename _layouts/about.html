---
layout: default
---
  
<article class="post">
    <div class="profile">
        <img class="img-circle avatar" itemprop="photo" alt="Minh Nguyen" src="{{ '/assets/mn_crop.png' | relative_url }}" loading="lazy" width="100" height="100">
        <p style="text-align: right">
        </p>
    </div>
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
